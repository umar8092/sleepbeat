<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartbeat Generator</title>
</head>
<body>
    <h1>Heartbeat Sound</h1>
    <button id="startButton">Start Heartbeat</button>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playHeartbeat(time) {
            const oscillator1 = audioCtx.createOscillator();
            const gainNode1 = audioCtx.createGain();

            oscillator1.frequency.setValueAtTime(150, time);
            oscillator1.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);

            gainNode1.gain.setValueAtTime(1, time);
            gainNode1.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

            oscillator1.connect(gainNode1);
            gainNode1.connect(audioCtx.destination);

            oscillator1.start(time);
            oscillator1.stop(time + 0.1);

            // Second beat ("dub") comes slightly after the first beat ("lub")
            const oscillator2 = audioCtx.createOscillator();
            const gainNode2 = audioCtx.createGain();

            oscillator2.frequency.setValueAtTime(150, time + 0.2);
            oscillator2.frequency.exponentialRampToValueAtTime(0.01, time + 0.3);

            gainNode2.gain.setValueAtTime(1, time + 0.2);
            gainNode2.gain.exponentialRampToValueAtTime(0.01, time + 0.3);

            oscillator2.connect(gainNode2);
            gainNode2.connect(audioCtx.destination);

            oscillator2.start(time + 0.2);
            oscillator2.stop(time + 0.3);
        }

        function startHeartbeat() {
            const bpm = 183 ; // Beats per minute (heart rate)
            const interval = 60 / bpm; // Interval in seconds between heartbeats

            // Schedule the heartbeat sound
            for (let i = 0; i < 16; i++) {
                const time = audioCtx.currentTime + i * interval;
                playHeartbeat(time);
            }
        }

        document.getElementById('startButton').addEventListener('click', startHeartbeat);
    </script>
</body>
</html>
